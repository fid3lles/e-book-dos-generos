<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Favicon baseado na logo: pilha de três livros (verde, magenta, azul) -->
  <g stroke="#1a1614" stroke-width="2.2" stroke-linejoin="round">
    <!-- Livro de trás (verde) -->
    <rect x="7" y="11" width="26" height="34" rx="2.5" fill="#5f8a3c"/>
    <path d="M30 11 h3 v34 h-3 z" fill="#efe7d0"/>
    <!-- Livro do meio (magenta) -->
    <rect x="15" y="16" width="26" height="34" rx="2.5" fill="#a32d97"/>
    <path d="M38 16 h3 v34 h-3 z" fill="#efe7d0"/>
    <!-- Livro da frente (azul) -->
    <rect x="23" y="21" width="26" height="34" rx="2.5" fill="#4a91b5"/>
    <path d="M46 21 h3 v34 h-3 z" fill="#efe7d0"/>
  </g>
  <!-- Estrela / brilho da capa -->
  <path d="M36 41 l1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 z" fill="#f2cf52"/>
</svg>
